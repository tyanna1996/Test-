services:
  - type: web
    name: audify-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && node dist/seed.js
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_PATH
        value: /opt/render/project/audify.db
      - key: CORS_ORIGINS
        value: https://audify-mono-71eafd.gitlab.io,http://localhost:5173
